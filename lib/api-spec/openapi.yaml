openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification for Pusat Kajian Pemberdayaan Masyarakat website
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: articles
    description: News and activity articles
  - name: gallery
    description: Photo and video gallery
  - name: programs
    description: Programs and activities
  - name: umkm
    description: UMKM Binaan (SME partners)
  - name: publications
    description: Research publications
  - name: partners
    description: Institutional partners
  - name: stats
    description: Dashboard statistics
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /articles:
    get:
      operationId: listArticles
      tags: [articles]
      summary: List articles
      parameters:
        - name: category
          in: query
          schema:
            type: string
          required: false
        - name: page
          in: query
          schema:
            type: number
          required: false
        - name: limit
          in: query
          schema:
            type: number
          required: false
      responses:
        "200":
          description: List of articles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Article"

  /articles/featured:
    get:
      operationId: listFeaturedArticles
      tags: [articles]
      summary: Get featured/pinned articles
      responses:
        "200":
          description: Featured articles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Article"

  /articles/recent:
    get:
      operationId: listRecentArticles
      tags: [articles]
      summary: Get recent articles
      parameters:
        - name: limit
          in: query
          schema:
            type: number
          required: false
      responses:
        "200":
          description: Recent articles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Article"

  /articles/{id}:
    get:
      operationId: getArticle
      tags: [articles]
      summary: Get a single article
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Article detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Article"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /gallery:
    get:
      operationId: listGallery
      tags: [gallery]
      summary: List gallery items
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [photo, video]
          required: false
      responses:
        "200":
          description: Gallery items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GalleryItem"

  /gallery/{id}:
    get:
      operationId: getGalleryItem
      tags: [gallery]
      summary: Get a single gallery item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Gallery item detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GalleryItem"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /programs:
    get:
      operationId: listPrograms
      tags: [programs]
      summary: List programs and activities
      responses:
        "200":
          description: Programs list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Program"

  /programs/{id}:
    get:
      operationId: getProgram
      tags: [programs]
      summary: Get a single program
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Program detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Program"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /umkm:
    get:
      operationId: listUmkm
      tags: [umkm]
      summary: List UMKM binaan
      responses:
        "200":
          description: UMKM list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Umkm"

  /umkm/{id}:
    get:
      operationId: getUmkm
      tags: [umkm]
      summary: Get a single UMKM
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: UMKM detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Umkm"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /publications:
    get:
      operationId: listPublications
      tags: [publications]
      summary: List research publications
      responses:
        "200":
          description: Publications list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Publication"

  /publications/{id}:
    get:
      operationId: getPublication
      tags: [publications]
      summary: Get a single publication
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Publication detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Publication"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /partners:
    get:
      operationId: listPartners
      tags: [partners]
      summary: List institutional partners
      responses:
        "200":
          description: Partners list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Partner"

  /stats:
    get:
      operationId: getStats
      tags: [stats]
      summary: Get homepage statistics
      responses:
        "200":
          description: Site statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteStats"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    Article:
      type: object
      properties:
        id:
          type: number
        title:
          type: string
        slug:
          type: string
        excerpt:
          type: ["string", "null"]
        content:
          type: string
        category:
          type: string
        author:
          type: string
        imageUrl:
          type: ["string", "null"]
        videoUrl:
          type: ["string", "null"]
        mediaUrls:
          type: array
          items:
            type: string
        isFeatured:
          type: boolean
        publishedAt:
          type: string
        createdAt:
          type: string
      required:
        - id
        - title
        - slug
        - content
        - category
        - author
        - mediaUrls
        - isFeatured
        - publishedAt
        - createdAt

    GalleryItem:
      type: object
      properties:
        id:
          type: number
        title:
          type: string
        description:
          type: ["string", "null"]
        type:
          type: string
          enum: [photo, video]
        url:
          type: string
        thumbnailUrl:
          type: ["string", "null"]
        category:
          type: ["string", "null"]
        createdAt:
          type: string
      required:
        - id
        - title
        - type
        - url
        - createdAt

    Program:
      type: object
      properties:
        id:
          type: number
        title:
          type: string
        description:
          type: string
        category:
          type: string
        imageUrl:
          type: ["string", "null"]
        startDate:
          type: ["string", "null"]
        endDate:
          type: ["string", "null"]
        status:
          type: string
          enum: [upcoming, ongoing, completed]
        createdAt:
          type: string
      required:
        - id
        - title
        - description
        - category
        - status
        - createdAt

    Umkm:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
        description:
          type: string
        sector:
          type: string
        ownerName:
          type: string
        location:
          type: string
        logoUrl:
          type: ["string", "null"]
        products:
          type: ["string", "null"]
        joinedYear:
          type: ["number", "null"]
        createdAt:
          type: string
      required:
        - id
        - name
        - description
        - sector
        - ownerName
        - location
        - createdAt

    Publication:
      type: object
      properties:
        id:
          type: number
        title:
          type: string
        authors:
          type: string
        abstract:
          type: ["string", "null"]
        type:
          type: string
          enum: [journal, conference, book, report]
        journalName:
          type: ["string", "null"]
        publishedYear:
          type: number
        doiUrl:
          type: ["string", "null"]
        pdfUrl:
          type: ["string", "null"]
        coverImageUrl:
          type: ["string", "null"]
        createdAt:
          type: string
      required:
        - id
        - title
        - authors
        - type
        - publishedYear
        - createdAt

    Partner:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
        description:
          type: ["string", "null"]
        type:
          type: string
          enum: [government, industry, university, community, ngo]
        logoUrl:
          type: ["string", "null"]
        website:
          type: ["string", "null"]
        location:
          type: ["string", "null"]
        createdAt:
          type: string
      required:
        - id
        - name
        - type
        - createdAt

    SiteStats:
      type: object
      properties:
        totalArticles:
          type: number
        totalPrograms:
          type: number
        totalUmkm:
          type: number
        totalPartners:
          type: number
        totalPublications:
          type: number
        totalGallery:
          type: number
      required:
        - totalArticles
        - totalPrograms
        - totalUmkm
        - totalPartners
        - totalPublications
        - totalGallery
